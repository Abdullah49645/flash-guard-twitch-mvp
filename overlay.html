<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Guard · OBS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#f5f6f7;font:14px/1.4 Inter,system-ui,sans-serif}body{display:grid;place-items:center}.stage{position:relative;width:100%;height:100%;display:grid;place-items:center}.placeholder{color:#d5dae0;text-align:center;background:#101418dd;padding:16px 22px;border:1px solid #ffffff22;border-radius:12px}.placeholder strong{display:block;font-size:12px;letter-spacing:.12em;color:#fff}.placeholder span{opacity:.7}.video{max-width:100%;max-height:100%;display:none}.badge{display:none;position:absolute;left:18px;top:18px;padding:7px 11px;border-radius:999px;background:#101418dc;border:1px solid #ffffff33;color:#fff;font-weight:600;font-size:12px}.clear{position:absolute;right:16px;top:16px;border:0;border-radius:8px;padding:9px 12px;background:#101418dc;color:#fff;cursor:pointer;display:none}</style></head><body><div class="stage"><div id="placeholder" class="placeholder"><strong>FLASH GUARD</strong><span>Waiting for moderator approval</span></div><video id="video" class="video" controls playsinline preload="none"></video><div id="badge" class="badge">Moderator approved</div><button id="clear" class="clear">Clear</button></div><script>
const video=document.querySelector('#video'),placeholder=document.querySelector('#placeholder'),badge=document.querySelector('#badge'),clear=document.querySelector('#clear');let current='';async function refresh(){try{const s=await(await fetch('/api/state',{cache:'no-store'})).json();const p=s.playback;if(!p){if(current){video.pause();video.removeAttribute('src');video.load();current=''}video.style.display='none';badge.style.display='none';clear.style.display='none';placeholder.style.display='block';return}if(current!==p.itemId){video.pause();video.src='/media?id='+encodeURIComponent(p.itemId);video.load();current=p.itemId}video.style.display='block';badge.style.display='block';clear.style.display='block';placeholder.style.display='none'}catch{}}clear.onclick=async()=>{await fetch('/api/playback/clear',{method:'POST'});refresh()};setInterval(refresh,1500);refresh();
</script></body></html>
